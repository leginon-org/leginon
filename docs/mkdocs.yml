site_name: Myami Documentation
repo_url: https://github.com/leginon-org/leginon
repo_name: leginon-org/leginon
docs_dir: content
site_dir: build
site_url: https://leginon-org.github.io/leginon/
site_description: Documentation for Leginon, Appion
theme:
  name: material
  palette:
    # Palette toggle for light mode (default)
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github
  logo: https://avatars.githubusercontent.com/u/159507882?s=128
plugins:
  - search
  - site-urls:
      prefix: "/"
  - redirects:
      redirect_maps: { 'index.md': 'leginon/index.md' }
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

markdown_extensions:
  - toc
  - tables
  - fenced_code
  - codehilite
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight
  - pymdownx.inlinehilite

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/leginon-org/leginon
      name: Leginon on Github

